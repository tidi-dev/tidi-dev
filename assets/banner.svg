<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dai Ho Trong (TiDi) — player one</title>
  <desc id="d">Still learning. Always solving. No perfect system, only trade-offs. Bring me a pain point.</desc>
  <defs>
    <clipPath id="card"><rect width="840" height="250" rx="12"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e3b341" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xp" x1="0" x2="1">
      <stop offset="0" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="seg" x="560" y="146" width="12" height="10" patternUnits="userSpaceOnUse">
      <rect x="10" width="2" height="10" fill="#0d1117"/>
    </pattern>
    <clipPath id="prompt"><rect x="34" y="182" width="477" height="35" rx="5"/></clipPath>
    <clipPath id="xpclip"><rect x="560" y="146" width="168.0" height="10"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .muted { fill: #8b949e; }
    .label { fill: #8b949e; font-size: 11px; letter-spacing: 2px; }
    .tag { fill: #e6edf3; font-size: 17px; }
    .blink { animation: blink 1.05s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .xp { transform-box: fill-box; transform-origin: left center; animation: xp 2.2s cubic-bezier(.2,.8,.2,1) .4s both; }
    @keyframes xp { from { transform: scaleX(0); } to { transform: scaleX(0.7); } }
    .shine { animation: shine 6s ease-in-out 2.8s infinite; }
    @keyframes shine { 0% { transform: translateX(0); } 22%, 100% { transform: translateX(208px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes v0{0%{opacity:1} 33.333%{opacity:0} 100%{opacity:0}}
    @keyframes c0{0%{transform:translateX(0)}2.333%{transform:translateX(0);animation-timing-function:steps(31,end)}16.800%{transform:translateX(316.2px)}28.000%{transform:translateX(316.2px);animation-timing-function:steps(31,end)}30.667%{transform:translateX(0)}100%{transform:translateX(0)}}
    .v0{animation:v0 15.0s step-end infinite} .c0{animation:c0 15.0s linear infinite}
    @keyframes v1{0%{opacity:0} 33.333%{opacity:1} 66.667%{opacity:0} 100%{opacity:0}}
    @keyframes c1{0%{transform:translateX(0)}35.667%{transform:translateX(0);animation-timing-function:steps(35,end)}52.000%{transform:translateX(357.0px)}61.333%{transform:translateX(357.0px);animation-timing-function:steps(35,end)}64.000%{transform:translateX(0)}100%{transform:translateX(0)}}
    .v1{animation:v1 15.0s step-end infinite} .c1{animation:c1 15.0s linear infinite}
    @keyframes v2{0%{opacity:0} 66.667%{opacity:1} 100%{opacity:1}}
    @keyframes c2{0%{transform:translateX(0)}69.000%{transform:translateX(0);animation-timing-function:steps(22,end)}79.267%{transform:translateX(224.4px)}94.667%{transform:translateX(224.4px);animation-timing-function:steps(22,end)}97.333%{transform:translateX(0)}100%{transform:translateX(0)}}
    .v2{animation:v2 15.0s step-end infinite} .c2{animation:c2 15.0s linear infinite}
    @media (prefers-reduced-motion: reduce) {
      .blink, .shine, .pulse, .v0, .v1, .v2, .c0, .c1, .c2 { animation: none; }
      .xp { animation: none; transform: scaleX(0.7); }
      .c0 { transform: translateX(316.2px); }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="250" fill="#0d1117"/>
    <rect y="36" width="840" height="214" fill="url(#grid)"/>
    <rect width="840" height="250" fill="url(#glow)"/>
    <!-- window chrome -->
    <rect width="840" height="36" fill="#161b22"/>
    <line x1="0" y1="36.5" x2="840" y2="36.5" stroke="#30363d"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="41" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="18" r="5.5" fill="#28c840"/>
    <text x="420.0" y="22.5" text-anchor="middle" class="muted" font-size="12">tidi@saigon: ~/player-1 — zsh</text>

    <!-- identity -->
    <text x="40" y="84" fill="#e3b341" font-size="12" font-weight="700" letter-spacing="3">▸ PLAYER 1</text>
    <text x="40" y="132" fill="#e6edf3" font-size="40" font-weight="700" letter-spacing="1">DAI HO TRONG</text>
    <text x="40" y="160" class="muted" font-size="14">aka TiDi · Daniel</text>

    <!-- prompt line -->
    <rect x="32.5" y="180.5" width="480" height="38" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="48" y="205" fill="#3fb950" font-size="17" font-weight="700">$</text>
    <g class="v0" clip-path="url(#prompt)">
      <text x="70" y="205" class="tag" textLength="316.2" lengthAdjust="spacingAndGlyphs">still learning. always solving.</text>
      <g class="c0">
        <rect x="69" y="188" width="332.2" height="24" fill="#0d1117"/>
        <rect x="71" y="191" width="9" height="18" rx="1" fill="#3fb950" class="blink"/>
      </g>
    </g>
    <g class="v1" opacity="0" clip-path="url(#prompt)">
      <text x="70" y="205" class="tag" textLength="357.0" lengthAdjust="spacingAndGlyphs">no perfect system. only trade-offs.</text>
      <g class="c1">
        <rect x="69" y="188" width="373.0" height="24" fill="#0d1117"/>
        <rect x="71" y="191" width="9" height="18" rx="1" fill="#3fb950" class="blink"/>
      </g>
    </g>
    <g class="v2" opacity="0" clip-path="url(#prompt)">
      <text x="70" y="205" class="tag" textLength="224.4" lengthAdjust="spacingAndGlyphs">bring me a pain point.</text>
      <g class="c2">
        <rect x="69" y="188" width="240.4" height="24" fill="#0d1117"/>
        <rect x="71" y="191" width="9" height="18" rx="1" fill="#3fb950" class="blink"/>
      </g>
    </g>

    <!-- HUD -->
    <line x1="530.5" y1="70" x2="530.5" y2="222" stroke="#21262d"/>
    <text x="560" y="84" class="label">STATUS</text>
    <circle cx="565" cy="103" r="4" fill="#3fb950" class="pulse"/>
    <text x="576" y="108" fill="#e6edf3" font-size="14">accepting quests</text>

    <text x="560" y="138" class="label">XP · SYSTEM DESIGN</text>
    <rect x="560" y="146" width="240" height="10" rx="2" fill="#21262d"/>
    <rect x="560" y="146" width="240" height="10" fill="url(#xp)" class="xp"/>
    <g clip-path="url(#xpclip)">
      <rect x="520" y="146" width="36" height="10" fill="url(#shine)" class="shine"/>
    </g>
    <rect x="560" y="146" width="240" height="10" fill="url(#seg)"/>
    <text x="560" y="182" class="label">LVL</text>
    <text x="604" y="182" fill="#c9d1d9" font-size="13">still leveling</text>
    <text x="560" y="204" class="label">MAX</text>
    <text x="604" y="204" fill="#c9d1d9" font-size="13">not a thing</text>
  </g>
  <rect x="0.5" y="0.5" width="839" height="249" rx="11.5" fill="none" stroke="#30363d"/>
</svg>
